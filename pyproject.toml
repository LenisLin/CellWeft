[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cellweft"
version = "0.1.0"
description = "Spatial protein image preparation and paired cell indexing"
requires-python = ">=3.11"
dependencies = ["numpy>=2", "scipy>=1.13", "pandas>=2", "pyarrow>=16", "tifffile>=2025.3.30", "imagecodecs>=2025.3.30", "PyYAML>=6", "Pillow>=10"]

[project.optional-dependencies]
sources = ["readimc>=0.9.2", "zarr>=3", "h5py>=3"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/data"]
